<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Captura de Teclas</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="container">
        <h1>Pressione qualquer tecla</h1>

        <div class="cards">
            <div class="card">
                <h2>Nome da Tecla</h2>
                <p id="key">-</p>
            </div>

            <div class="card">
                <h2>Código da Tecla</h2>
                <p id="code">-</p>
            </div>

            <div class="card">
                <h2>Código Numérico</h2>
                <p id="keyCode">-</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
